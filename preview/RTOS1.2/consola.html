<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Consola de Diagnóstico &middot; FreeRTOS (Preview RTOS 1.1)</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:#0b1120;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;padding:16px 14px;}
    .container{max-width:960px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;}

    /* Hub Nav */
    .hub-link{display:inline-flex;align-items:center;gap:6px;color:#38bdf8;text-decoration:none;font-size:0.75em;font-weight:700;margin-bottom:12px;padding:4px 12px;background:rgba(56,189,248,0.08);border-radius:8px;border:1px solid rgba(56,189,248,0.2);transition:all 0.2s;}
    .hub-link:hover{color:#7dd3fc;background:rgba(56,189,248,0.18);transform:translateY(-1px);}

    /* Header Box */
    .header-box{background:linear-gradient(165deg,rgba(30,41,59,0.95),rgba(15,23,42,0.92));padding:16px 20px;border-radius:18px;border:1px solid rgba(56,189,248,0.12);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px;box-shadow:0 8px 30px rgba(0,0,0,0.45);}
    .title-group{display:flex;align-items:center;gap:14px;}
    .mac-dots{display:flex;gap:6px;}
    .mac-dot{width:11px;height:11px;border-radius:50%;}
    .mac-red{background:#ef4444;box-shadow:0 0 6px rgba(239,68,68,0.5);}
    .mac-yellow{background:#f59e0b;box-shadow:0 0 6px rgba(245,158,11,0.5);}
    .mac-green{background:#10b981;box-shadow:0 0 6px rgba(16,185,129,0.5);}
    .nav-back{color:#38bdf8;text-decoration:none;font-weight:700;font-size:0.82em;transition:0.2s;}
    .nav-back:hover{color:#7dd3fc;}
    .title-group h2{font-size:1.05em;color:#fff;font-weight:800;letter-spacing:-0.2px;display:flex;align-items:center;gap:8px;}

    /* Actions Toolbar */
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
    .btn{padding:7px 14px;border-radius:8px;font-size:0.75em;font-weight:700;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;transition:all 0.2s;}
    .btn:hover{background:#334155;color:#fff;}
    .btn.active{background:linear-gradient(135deg,#0284c7,#2563eb);color:#fff;border-color:#38bdf8;box-shadow:0 2px 8px rgba(37,99,235,0.3);}
    .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:0.72em;padding:4px 12px;border-radius:20px;background:rgba(52,211,153,0.12);color:#34d399;border:1px solid rgba(52,211,153,0.3);font-weight:800;letter-spacing:0.3px;}
    .latency{font-size:0.7em;font-weight:700;color:#34d399;padding:4px 9px;border-radius:8px;background:rgba(15,23,42,0.6);border:1px solid rgba(52,211,153,0.25);}

    /* Terminal Chassis */
    .term-container{flex:1;background:#020617;border-radius:18px;border:1px solid rgba(56,189,248,0.15);padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 4px 24px rgba(0,0,0,0.8);min-height:460px;max-height:calc(100vh - 140px);position:relative;}
    .term-container::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(56,189,248,0.3),transparent);}

    /* Log Rows */
    .log-row{font-size:0.82em;line-height:1.6;display:flex;gap:10px;word-break:break-all;border-bottom:1px solid rgba(255,255,255,0.03);padding-bottom:4px;align-items:baseline;}
    .log-row:hover{background:rgba(255,255,255,0.02);}
    .log-row.new{animation:log-in 0.3s cubic-bezier(.4,0,.2,1);}
    @keyframes log-in{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}

    .log-time{color:#64748b;min-width:70px;font-weight:600;font-variant-numeric:tabular-nums;}
    .log-tag{font-weight:800;min-width:80px;padding:1px 6px;border-radius:5px;font-size:0.88em;text-align:center;}
    .tag-INFO{background:rgba(56,189,248,0.12);color:#38bdf8;border:1px solid rgba(56,189,248,0.25);}
    .tag-WARN{background:rgba(245,158,11,0.12);color:#fbbf24;border:1px solid rgba(245,158,11,0.25);}
    .tag-ERR{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3);}
    .log-msg{color:#f1f5f9;flex:1;}
  </style>
</head>
<body>
  <div class='container'>
    <div style="text-align:left;">
      <a href='../index.html' class='hub-link'>&larr; Hub de Versiones (Tesis)</a>
    </div>

    <div class='header-box'>
      <div class='title-group'>
        <div class='mac-dots'>
          <div class='mac-dot mac-red'></div>
          <div class='mac-dot mac-yellow'></div>
          <div class='mac-dot mac-green'></div>
        </div>
        <a href='index.html' class='nav-back'>&larr; Men&uacute;</a>
        <h2>Consola de Diagn&oacute;stico (Preview RTOS 1.1)</h2>
      </div>
      <div class='actions'>
        <span class='status-pill'>&#9679; SMP DUAL-CORE</span>
        <span class='latency' id='latency'>18ms</span>
        <button class='btn active' id='btn-scroll' onclick='toggleScroll()'>Auto-Scroll: ON</button>
        <button class='btn' id='btn-pause' onclick='togglePause()'>Pausar</button>
        <button class='btn' onclick='clearScreen()'>Limpiar</button>
      </div>
    </div>

    <div class='term-container' id='term'></div>
  </div>

  <script>
    var autoScroll = true;
    var pausado = false;
    var term = document.getElementById('term');

    var mockLogs = [
      { t: 120, lvl: 0, tag: "BOOT", msg: "ESP32-S3 Dual-Core SMP inicializado @ 240MHz (16MB Flash, 8MB PSRAM)" },
      { t: 450, lvl: 0, tag: "FREERTOS", msg: "Task_Core0 pinned to Core 0 (Control loop 500Hz, PI, Watchdog)" },
      { t: 480, lvl: 0, tag: "FREERTOS", msg: "Task_Core1 pinned to Core 1 (AsyncWebServer, WebSocket, OTA)" },
      { t: 920, lvl: 0, tag: "I2C", msg: "Bus I2C inicializado @ 400kHz: AHT20 (0x38), BMP280 (0x76), ADS1115 (0x48), MCP4725 (0x60)" },
      { t: 1240, lvl: 0, tag: "THRM", msg: "Sistema térmico iniciado: 4 canales MAX6675 SPI en escucha activa (Tinas)" },
      { t: 1650, lvl: 0, tag: "VCSS", msg: "Sumidero VCSS listo (DAC MCP4725). Calibración NVS cargada: Gm = 1.0042 (2.008 S)" },
      { t: 2100, lvl: 0, tag: "UI_v1.1", msg: "Servidor Web RTOS 1.1 listo con feedback visual y animaciones en PROGMEM" },
      { t: 3400, lvl: 0, tag: "VCSS", msg: "Outer-loop comp @ 2Hz: I_Total = 2.401 A (R1: 1.200 A, R2: 1.201 A)" }
    ];

    function toggleScroll(){
      autoScroll = !autoScroll;
      var b = document.getElementById('btn-scroll');
      b.className = autoScroll ? 'btn active' : 'btn';
      b.innerText = autoScroll ? 'Auto-Scroll: ON' : 'Auto-Scroll: OFF';
    }

    function togglePause(){
      pausado = !pausado;
      var b = document.getElementById('btn-pause');
      b.className = pausado ? 'btn active' : 'btn';
      b.innerText = pausado ? 'Reanudar' : 'Pausar';
    }

    function clearScreen(){
      term.innerHTML = '';
    }

    function appendRow(l, isNew){
      var row = document.createElement('div');
      row.className = 'log-row' + (isNew ? ' new' : '');
      var lvlClass = (l.lvl === 2) ? 'ERR' : ((l.lvl === 1) ? 'WARN' : 'INFO');
      var tSec = (l.t / 1000).toFixed(3);
      row.innerHTML = 
        "<span class='log-time'>[" + tSec + "s]</span>" +
        "<span class='log-tag tag-" + lvlClass + "'>" + l.tag + "</span>" +
        "<span class='log-msg'>" + l.msg + "</span>";
      term.appendChild(row);
      if(autoScroll) term.scrollTop = term.scrollHeight;
    }

    mockLogs.forEach(function(l){ appendRow(l, false); });

    setInterval(function(){
      if(pausado) return;
      var lastT = mockLogs[mockLogs.length - 1].t;
      var newT = lastT + Math.round(1800 + Math.random() * 1500);
      var msgs = [
        { lvl: 0, tag: "VCSS", msg: "Muestreo shunts VCSS: I_Total = 2.403 A | DAC MCP4725 = 1492 bits" },
        { lvl: 0, tag: "THRM", msg: "Control PI Tina Limpieza: Temp = 64.9 °C, Ciclo Potencia = 28%" },
        { lvl: 0, tag: "AMB", msg: "Lectura ambiental AHT20/BMP280: 24.6 °C, 48% HR, 1013 hPa" },
        { lvl: 0, tag: "PH", msg: "Electrodo Tina Zincado (A0): pH 7.05 | Voltaje Sonda: 2.50 V" },
        { lvl: 0, tag: "CORE0", msg: "Tick watchdog FreeRTOS verificado en Core 0. Heap libre: 294 KB, PSRAM: 7.8 MB" }
      ];
      var chosen = msgs[Math.floor(Math.random() * msgs.length)];
      var newEntry = { t: newT, lvl: chosen.lvl, tag: chosen.tag, msg: chosen.msg };
      mockLogs.push(newEntry);
      appendRow(newEntry, true);

      // Simular latencia de red
      var lat = Math.round(15 + Math.random() * 8);
      document.getElementById('latency').innerText = lat + 'ms';
    }, 2400);
  </script>
</body>
</html>
