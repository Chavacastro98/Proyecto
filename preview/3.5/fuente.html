<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuente de Corriente — Versión 3.5</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #0b1120; color: #e2e8f0; min-height: 100vh; padding: 16px 14px; }
        .container { max-width: 540px; margin: 0 auto; }
        .hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding: 16px 20px; background: rgba(15,23,42,0.7); border-radius: 14px; border: 1px solid rgba(56,189,248,0.08); }
        .nav-back { color: #38bdf8; text-decoration: none; font-weight: 700; font-size: 0.82em; }
        .nav-back:hover { color: #7dd3fc; }
        .hdr-t { font-size: 1.1em; font-weight: 800; color: #fff; }
        .card { background: linear-gradient(165deg, rgba(30,41,59,0.95), rgba(15,23,42,0.9)); border-radius: 20px; padding: 26px 22px; border: 1px solid rgba(56,189,248,0.1); box-shadow: 0 12px 40px rgba(0,0,0,0.5); text-align: center; }
        .btn-pwr { width: 100%; font-size: 1.05em; padding: 16px; border-radius: 12px; font-weight: 800; cursor: pointer; border: none; transition: all 0.25s; letter-spacing: 0.5px; }
        .btn-pwr-off { background: #059669; color: #fff; box-shadow: 0 4px 20px rgba(5,150,105,0.35); }
        .btn-pwr-off:hover { background: #10b981; transform: translateY(-1px); }
        .btn-pwr-on { background: #dc2626; color: #fff; box-shadow: 0 4px 20px rgba(220,38,38,0.35); }
        .btn-pwr-on:hover { background: #ef4444; transform: translateY(-1px); }
        .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: 800; font-size: 0.8em; margin: 16px 0 10px; letter-spacing: 0.3px; }
        .status-on { background: rgba(5,150,105,0.15); color: #34d399; border: 1px solid rgba(52,211,153,0.3); }
        .status-off { background: rgba(220,38,38,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
        .amp-box { font-size: 52px; color: #38bdf8; margin: 8px 0 16px; font-weight: 900; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
        .amp-box span { color: #fff; }
        .btn-mode-wrap { display: flex; gap: 8px; margin-bottom: 18px; }
        .btn-m { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 800; font-size: 0.8em; cursor: pointer; transition: all 0.2s; }
        .btn-m.act { background: #2563eb; color: #fff; box-shadow: 0 2px 10px rgba(37,99,235,0.35); }
        .btn-m.inact { background: #1e293b; color: #64748b; border: 1px solid #334155; }
        .btn-m.inact:hover { background: #334155; color: #94a3b8; }
        .ctrl-group { background: rgba(15,23,42,0.6); padding: 14px; border-radius: 12px; margin-top: 12px; text-align: left; border: 1px solid rgba(51,65,85,0.4); }
        .ctrl-group label { font-weight: 700; font-size: 0.8em; color: #94a3b8; display: flex; justify-content: space-between; }
        .ctrl-group b { color: #38bdf8; }
        input[type=range] { width: 100%; accent-color: #38bdf8; margin: 10px 0 2px; cursor: pointer; }

        /* Panel VCSS v3.5 */
        .vcss-panel { background: rgba(15,23,42,0.6); border-radius: 14px; padding: 16px; margin-top: 16px; border: 1px solid rgba(56,189,248,0.15); text-align: left; }
        .vcss-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.7em; color: #94a3b8; font-weight: 700; letter-spacing: 0.5px; }
        .vcss-badge { background: rgba(5,150,105,0.15); color: #34d399; border: 1px solid rgba(52,211,153,0.3); padding: 3px 8px; border-radius: 6px; font-size: 0.75em; font-weight: 800; }
        .vcss-badge.off { background: rgba(71,85,105,0.2); color: #94a3b8; border-color: #475569; }
        .vcss-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .vcss-item { background: #0b1120; padding: 10px 6px; border-radius: 10px; text-align: center; border: 1px solid rgba(51,65,85,0.4); }
        .vcss-lbl { font-size: 0.62em; color: #64748b; font-weight: 700; margin-bottom: 3px; text-transform: uppercase; }
        .vcss-val { font-size: 1.05em; font-weight: 900; color: #38bdf8; font-variant-numeric: tabular-nums; }
        .vcss-sub { font-size: 0.65em; color: #94a3b8; font-weight: 600; margin-top: 3px; }
        .vcss-actions { display: flex; gap: 8px; }
        .btn-vcss { flex: 1; padding: 9px 10px; background: #1e293b; border: 1px solid #334155; color: #cbd5e1; border-radius: 8px; font-size: 0.72em; font-weight: 800; cursor: pointer; transition: all 0.2s; }
        .btn-vcss:hover { background: #334155; color: #fff; }
        .btn-cal { border-color: rgba(251,191,36,0.3); color: #fbbf24; }
        .btn-cal:hover { background: rgba(217,119,6,0.2); color: #fcd34d; }
    </style>
</head>
<body>
    <div class="container">
        <div class="hdr">
            <a href="index.html" class="nav-back">&larr; Men&uacute;</a>
            <span class="hdr-t">Fuente de Corriente &middot; v3.5</span>
            <div></div>
        </div>
        <div class="card">
            <button class="btn-pwr btn-pwr-off" id="btn-power" onclick="togglePower()">ENCENDER FUENTE</button>
            <div><span class="status-badge status-off" id="status-badge">ESTADO: DESACTIVADA (0.00 A)</span></div>
            <div class="amp-box"><span id="amp-amps">0.00</span> A</div>
            <div class="btn-mode-wrap">
                <button class="btn-m act" id="btn-dc" onclick="setModo(0)">CONTINUA (DC)</button>
                <button class="btn-m inact" id="btn-pulsed" onclick="setModo(1)">PULSADA (PWM)</button>
            </div>
            <div class="ctrl-group">
                <label><span>Amplitud DAC: <b id="amp-bits">1024</b> bits</span><span>(<span id="amp-calc">1.65</span> A)</span></label>
                <input type="range" id="slide-amp" min="0" max="4095" value="1024" oninput="onAmpChange(this.value)">
            </div>
            <div id="pulsed-options" style="display:none;">
                <div class="ctrl-group">
                    <label><span>Frecuencia</span><b id="freq-val">1 Hz</b></label>
                    <input type="range" id="slide-freq" min="1" max="100" value="1" oninput="sendParam('f', this.value)">
                </div>
                <div class="ctrl-group">
                    <label><span>Ciclo de Trabajo</span><b id="duty-val">50 %</b></label>
                    <input type="range" id="slide-duty" min="1" max="99" value="50" oninput="sendParam('d', this.value)">
                </div>
            </div>

            <!-- Panel Sensado VCSS Shunts (v3.5) -->
            <div class="vcss-panel">
                <div class="vcss-hdr">
                    <span>MONITOREO VCSS &middot; SHUNTS DUALES</span>
                    <div style="display:flex;gap:6px;">
                        <span class="vcss-badge" id="rele-badge">RELÉ +12V: AISLADO</span>
                        <span class="vcss-badge" id="comp-badge">LAZO CERRADO: ACTIVO</span>
                    </div>
                </div>
                <div class="vcss-grid">
                    <div class="vcss-item">
                        <div class="vcss-lbl">Rama 1 (MOSFET 1)</div>
                        <div class="vcss-val" id="i1-val">0.00 A</div>
                        <div class="vcss-sub" id="v1-val">0.000 V</div>
                    </div>
                    <div class="vcss-item">
                        <div class="vcss-lbl">Rama 2 (MOSFET 2)</div>
                        <div class="vcss-val" id="i2-val">0.00 A</div>
                        <div class="vcss-sub" id="v2-val">0.000 V</div>
                    </div>
                    <div class="vcss-item">
                        <div class="vcss-lbl">Total Medido</div>
                        <div class="vcss-val" id="itot-val" style="color:#34d399;">0.00 A</div>
                        <div class="vcss-sub" id="gm-val">Gm: 2.000 S</div>
                    </div>
                </div>
                <div class="vcss-actions">
                    <button class="btn-vcss" id="btn-comp" onclick="toggleComp()">&#9881; Desactivar Lazo</button>
                    <button class="btn-vcss btn-cal" onclick="calibrarVCSS()">&#9889; Auto-Calibrar Shunts</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        var fuenteActiva = false;
        var isDragging = false;
        var compActivo = true;
        var mockFuente = { 
            act: 0, modo: 0, amp: 1024, sp: 1024, freq: 1, duty: 50, 
            amps: 1.65, i_real: 1.65, i1: 0.82, i2: 0.83, vs1: 0.825, vs2: 0.825, 
            gm: 1.995, comp: 1, rele: 0 
        };

        function updateUI(d){
            fuenteActiva = (d.act == 1);
            compActivo = (d.comp == 1);
            var btnPwr = document.getElementById('btn-power');
            var badge = document.getElementById('status-badge');
            var ampVal = parseFloat(d.amps).toFixed(2);
            
            if (fuenteActiva) {
                btnPwr.innerText = "APAGAR FUENTE";
                btnPwr.className = "btn-pwr btn-pwr-on";
                badge.innerText = "ESTADO: SALIDA ACTIVA (" + ampVal + " A)";
                badge.className = "status-badge status-on";
                document.getElementById('amp-amps').innerText = ampVal;

                var iTot = parseFloat(d.i_real || d.amps).toFixed(2);
                var i1 = (iTot / 2 * 0.99).toFixed(2);
                var i2 = (iTot - i1).toFixed(2);
                document.getElementById('i1-val').innerText = i1 + ' A';
                document.getElementById('i2-val').innerText = i2 + ' A';
                document.getElementById('v1-val').innerText = (i1 * 1.0).toFixed(3) + ' V';
                document.getElementById('v2-val').innerText = (i2 * 1.0).toFixed(3) + ' V';
                document.getElementById('itot-val').innerText = iTot + ' A';
            } else {
                btnPwr.innerText = "ENCENDER FUENTE";
                btnPwr.className = "btn-pwr btn-pwr-off";
                badge.innerText = "ESTADO: DESACTIVADA (0.00 A)";
                badge.className = "status-badge status-off";
                document.getElementById('amp-amps').innerText = "0.00";
                document.getElementById('i1-val').innerText = "0.00 A";
                document.getElementById('i2-val').innerText = "0.00 A";
                document.getElementById('v1-val').innerText = "0.000 V";
                document.getElementById('v2-val').innerText = "0.000 V";
                document.getElementById('itot-val').innerText = "0.00 A";
            }

            var isPulsed = (d.modo == 1);
            document.getElementById('pulsed-options').style.display = isPulsed ? 'block' : 'none';
            document.getElementById('btn-dc').className = isPulsed ? 'btn-m inact' : 'btn-m act';
            document.getElementById('btn-pulsed').className = isPulsed ? 'btn-m act' : 'btn-m inact';

            var setpoint = d.sp || d.amp;
            document.getElementById('slide-amp').value = setpoint;
            document.getElementById('amp-bits').innerText = setpoint;
            document.getElementById('amp-calc').innerText = ampVal;
            document.getElementById('slide-freq').value = d.freq;
            document.getElementById('freq-val').innerText = d.freq + ' Hz';
            document.getElementById('slide-duty').value = d.duty;
            document.getElementById('duty-val').innerText = d.duty + ' %';
            document.getElementById('gm-val').innerText = 'Gm: ' + (d.gm || '2.000') + ' S';

            var compBadge = document.getElementById('comp-badge');
            var btnComp = document.getElementById('btn-comp');
            if (compActivo) {
                compBadge.className = 'vcss-badge';
                compBadge.innerText = 'LAZO CERRADO: ACTIVO';
                btnComp.innerText = '⚙ Desactivar Lazo';
            } else {
                compBadge.className = 'vcss-badge off';
                compBadge.innerText = 'LAZO ABIERTO (IDEAL)';
                btnComp.innerText = '⚙ Activar Lazo';
            }

            var releBadge = document.getElementById('rele-badge');
            if (fuenteActiva || d.rele == 1) {
                releBadge.className = 'vcss-badge';
                releBadge.innerText = 'RELÉ +12V: ENERGIZADO';
            } else {
                releBadge.className = 'vcss-badge off';
                releBadge.innerText = 'RELÉ +12V: AISLADO (0V)';
            }
        }

        function loadFuenteData(){
            if (isDragging) return;
            fetch('/data_f')
                .then(function(r){ return r.json(); })
                .then(function(d){ updateUI(d); })
                .catch(function(){ updateUI(mockFuente); });
        }

        function togglePower(){
            var attemptingOn = !fuenteActiva;
            var phActivo = (localStorage.getItem('sim_ph_on') === '1');
            if (attemptingOn && phActivo) {
                alert('¡Bloqueado por Interlock!\nEl módulo de pH está activo.\nDebes apagar el pH manualmente en su menú antes de encender la fuente de corriente.');
                return;
            }
            fuenteActiva = attemptingOn;
            localStorage.setItem('sim_fuente_on', fuenteActiva ? '1' : '0');
            mockFuente.act = fuenteActiva ? 1 : 0;
            updateUI(mockFuente);
            var nuevoEstado = fuenteActiva ? 1 : 0;
            fetch('/act_f?run=' + nuevoEstado).catch(function(){});
        }

        function setModo(m){
            mockFuente.modo = m;
            document.getElementById('pulsed-options').style.display = (m==1) ? 'block' : 'none';
            document.getElementById('btn-dc').className = (m==1) ? 'btn-m inact' : 'btn-m act';
            document.getElementById('btn-pulsed').className = (m==1) ? 'btn-m act' : 'btn-m inact';
            fetch('/modo_f?v=' + m).catch(function(){});
        }

        function onAmpChange(v){
            isDragging = true;
            document.getElementById('amp-bits').innerText = v;
            var amps = ((v / 4095.0) * 6.6).toFixed(2);
            document.getElementById('amp-calc').innerText = amps;
            mockFuente.amp = v;
            mockFuente.sp = v;
            mockFuente.amps = amps;
            mockFuente.i_real = amps;
            if (fuenteActiva) {
                document.getElementById('amp-amps').innerText = amps;
                var i1 = (amps / 2 * 0.99).toFixed(2);
                var i2 = (amps - i1).toFixed(2);
                document.getElementById('i1-val').innerText = i1 + ' A';
                document.getElementById('i2-val').innerText = i2 + ' A';
                document.getElementById('v1-val').innerText = (i1 * 1.0).toFixed(3) + ' V';
                document.getElementById('v2-val').innerText = (i2 * 1.0).toFixed(3) + ' V';
                document.getElementById('itot-val').innerText = amps + ' A';
            }
            fetch('/set_f?p=a&v=' + v).catch(function(){});
            setTimeout(function(){ isDragging = false; }, 1000);
        }

        function sendParam(p, v){
            if(p=='f') { document.getElementById('freq-val').innerText = v + ' Hz'; mockFuente.freq = v; }
            if(p=='d') { document.getElementById('duty-val').innerText = v + ' %'; mockFuente.duty = v; }
            fetch('/set_f?p=' + p + '&v=' + v).catch(function(){});
        }

        function toggleComp(){
            compActivo = !compActivo;
            mockFuente.comp = compActivo ? 1 : 0;
            updateUI(mockFuente);
            fetch('/set_comp_f?v=' + (compActivo ? 1 : 0)).catch(function(){});
        }

        function calibrarVCSS(){
            if(!confirm('¿Iniciar auto-calibración de transconductancia VCSS?\nSe aplicará una corriente de prueba de 1.50 A durante 1 segundo.')) return;
            fetch('/cal_vcss')
                .then(function(r){ return r.json(); })
                .then(function(d){
                    alert('¡Calibración exitosa!\nFactor de Ganancia Gm: ' + d.gm + '\nGuardado en NVS.');
                    mockFuente.gm = d.gm;
                    updateUI(mockFuente);
                })
                .catch(function(){
                    alert('[Vista Previa] ¡Calibración exitosa simulada!\nCorriente de prueba: 1.50 A\nFactor de Ganancia medido Gm: 1.995 S\nGuardado en NVS.');
                    mockFuente.gm = 1.995;
                    updateUI(mockFuente);
                });
        }

        setInterval(loadFuenteData, 1500); 
        loadFuenteData();
    </script>
</body>
</html>
