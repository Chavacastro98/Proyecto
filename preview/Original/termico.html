<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Térmico - Original</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            width: 220px;
            border-left: 5px solid #38bdf8;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn {
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            margin: 10px;
            font-weight: bold;
            font-size: 1em;
            transition: 0.2s;
        }
        .btn-act {
            background: #22c55e;
            color: white;
        }
        .btn-stop {
            background: #ef4444;
            color: white;
        }
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .nav-back {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05em;
        }
        .nav-back:hover {
            color: #7dd3fc;
        }
        .sp-box {
            margin-top: 10px;
            background: #0f172a;
            padding: 8px;
            border-radius: 8px;
        }
        .btn-step {
            background: #3b82f6;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1em;
        }
        .btn-step:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        .badge-error {
            background: #ef4444;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <a href="index.html" class="nav-back">⬅ Volver al Menú</a>
    <h2>Lazos de Control Térmico</h2>
    <button class="btn btn-act" onclick="toggleT(1)">ENCENDER SISTEMA</button>
    <button class="btn btn-stop" onclick="toggleT(0)">APAGAR SISTEMA</button>
    
    <div class="grid" id="t-cards"></div>

    <script>
        const nombres = ["Limpieza", "Decapado", "Zincado (Celda Hull)", "Niquelado"];
        let mockData = [
            { t: 60.1, sp: 60.0, run: 1 },
            { t: 44.8, sp: 45.0, run: 1 },
            { t: 28.5, sp: 30.0, run: 0 },
            { t: 55.0, sp: 55.0, run: 1 }
        ];

        function renderThermal(data){
            let h = '';
            data.forEach((c, i) => {
                let esError = (c.t <= 0.0 || c.t >= 150.0);
                let colorBorde = esError ? '#ef4444' : (c.run == 1 ? '#22c55e' : '#38bdf8');
                let estadoHtml = esError ? 
                    '<div class="badge-error">⚠️ FALLA TERMOPAR (PARADA)</div>' : 
                    (c.run == 1 ? '<span style="color:#22c55e">Activo</span>' : '<span style="color:#ef4444">Bloqueado</span>');

                h += `<div class='card' style='border-left-color:${colorBorde}'>
                    <h3>${nombres[i]}</h3>
                    <p>Actual: <b style='font-size:1.3em; color:${esError ? '#ef4444' : '#38bdf8'};'>${esError ? 'ERROR' : c.t.toFixed(1) + '°C'}</b></p>
                    <div class='sp-box'>
                        <span>Setpoint: <b>${c.sp.toFixed(1)}°C</b></span><br><br>
                        <button class='btn-step' ${c.run == 1 || esError ? 'disabled' : ''} onclick='setSP(${i},${c.sp - 1})'>-</button>
                        <button class='btn-step' ${c.run == 1 || esError ? 'disabled' : ''} onclick='setSP(${i},${c.sp + 1})'>+</button>
                    </div>
                    <p>Estado: ${estadoHtml}</p>
                </div>`;
            });
            document.getElementById('t-cards').innerHTML = h;
        }

        function loadThermal(){
            fetch('/data_t')
                .then(r => r.json())
                .then(data => {
                    renderThermal(data);
                })
                .catch(() => {
                    // Actualización de preview local
                    mockData.forEach(c => {
                        if (c.run === 1) {
                            c.t = c.sp + (Math.random() * 0.4 - 0.2);
                        }
                    });
                    renderThermal(mockData);
                });
        }

        function setSP(id, val){ 
            if(val < 0) val = 0; 
            if(val > 150) val = 150;
            mockData[id].sp = val;
            fetch(`/set_t?id=${id}&v=${val}`)
                .then(r => {
                    if(r.status === 403) alert("¡Detén el sistema primero para cambiar el setpoint!");
                    loadThermal();
                })
                .catch(() => loadThermal()); 
        }

        function toggleT(run){ 
            mockData.forEach(c => c.run = run);
            fetch(`/act_t?run=${run}`)
                .then(() => loadThermal())
                .catch(() => loadThermal()); 
        }

        setInterval(loadThermal, 2000); 
        loadThermal();
    </script>
</body>
</html>
