<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de pH Dual - Beta</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #1e293b;
            border-radius: 15px;
            padding: 20px;
            width: 300px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        .ph-val {
            font-size: 60px;
            color: #2ecc71;
            font-weight: bold;
            margin: 10px 0;
        }
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
            font-size: 0.95em;
            transition: 0.2s;
        }
        .btn:hover {
            background: #2980b9;
        }
        .nav-back {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05em;
        }
        .nav-back:hover {
            color: #7dd3fc;
        }
        .step-box {
            display: none;
            background: #334155;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
        .step-box p {
            margin: 5px 0 10px;
            font-weight: bold;
            color: #38bdf8;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <a href="index.html" class="nav-back">⬅ Menú</a>
    <h1>MONITOR DE pH DUAL</h1>
    <div class="grid">
        <div class="card">
            <h3>Sonda 1</h3>
            <div id="ph1" class="ph-val">7.02</div>
            <div id="main1"><button class="btn" onclick="startCal(1)">Calibrar</button></div>
            <div id="cal1" class="step-box">
                <p id="instr1">Sumergir en Buffer pH 7.0</p>
                <button id="btn1" class="btn" onclick="nextStep(1)">LISTO</button>
            </div>
        </div>
        <div class="card">
            <h3>Sonda 2</h3>
            <div id="ph2" class="ph-val">4.18</div>
            <div id="main2"><button class="btn" onclick="startCal(2)">Calibrar</button></div>
            <div id="cal2" class="step-box">
                <p id="instr2">Sumergir en Buffer pH 7.0</p>
                <button id="btn2" class="btn" onclick="nextStep(2)">LISTO</button>
            </div>
        </div>
    </div>
    <script>
        let step1 = 1, step2 = 1;

        setInterval(() => { 
            if(step1 == 1 && step2 == 1) {
                fetch('/get_ph_dual')
                    .then(r => r.json())
                    .then(d => {
                        document.getElementById('ph1').innerText = d.p1;
                        document.getElementById('ph2').innerText = d.p2;
                    })
                    .catch(() => {
                        const p1 = (7.00 + (Math.random() * 0.06 - 0.03)).toFixed(2);
                        const p2 = (4.18 + (Math.random() * 0.04 - 0.02)).toFixed(2);
                        document.getElementById('ph1').innerText = p1;
                        document.getElementById('ph2').innerText = p2;
                    });
            }
        }, 1500);

        function startCal(id){ 
            if(id == 1){
                step1 = 2;
                document.getElementById('main1').style.display = 'none';
                document.getElementById('cal1').style.display = 'block';
                document.getElementById('instr1').innerText = 'Sumergir en Buffer pH 7.0';
            } else {
                step2 = 2;
                document.getElementById('main2').style.display = 'none';
                document.getElementById('cal2').style.display = 'block';
                document.getElementById('instr2').innerText = 'Sumergir en Buffer pH 7.0';
            }
        }

        function nextStep(id){
            let s = (id == 1) ? step1 : step2; 
            let p = (s == 2) ? 7 : 4;

            fetch(`/do_cal_ph?id=${id}&p=${p}`)
                .then(() => {
                    handleCalStep(id, p);
                })
                .catch(() => {
                    handleCalStep(id, p);
                });
        }

        function handleCalStep(id, p){
            if(p == 7){ 
                if(id == 1) step1 = 3; 
                else step2 = 3; 
                document.getElementById('instr' + id).innerHTML = 'Sumergir en Buffer pH 4.0'; 
            } else { 
                alert('¡Sonda ' + id + ' Calibrada con éxito (2 Puntos)!'); 
                if(id == 1) {
                    step1 = 1;
                    document.getElementById('main1').style.display = 'block';
                    document.getElementById('cal1').style.display = 'none';
                } else {
                    step2 = 1;
                    document.getElementById('main2').style.display = 'block';
                    document.getElementById('cal2').style.display = 'none';
                }
            }
        }
    </script>
</body>
</html>
