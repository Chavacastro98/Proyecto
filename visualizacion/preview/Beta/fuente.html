<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuente de Corriente - Beta</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: #1e293b;
            border-radius: 15px;
            padding: 20px;
            margin: 10px auto;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }
        .amp {
            font-size: 48px;
            color: #22c55e;
            margin: 15px 0;
            font-weight: bold;
        }
        .btn {
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 10px;
            border: none;
            margin: 5px;
            font-weight: bold;
            width: 45%;
            transition: 0.2s;
        }
        .btn-power {
            background: #3b82f6;
            color: white;
            width: 95%;
            font-size: 18px;
            margin-top: 20px;
        }
        .btn-power:hover {
            background: #2563eb;
            transform: scale(1.02);
        }
        .estado {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .active {
            background: #22c55e;
            color: white;
        }
        .inactive {
            background: #475569;
            color: #94a3b8;
        }
        .nav-back {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05em;
        }
        .nav-back:hover {
            color: #7dd3fc;
        }
        input[type=range] {
            width: 100%;
            accent-color: #38bdf8;
            margin: 8px 0;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <a href="index.html" class="nav-back">⬅ Menú</a>
    <h1>FUENTE DE CORRIENTE</h1>
    <div class="card">
        <div class="estado" id="lbl-estado" style="color:#ef4444"><b>APAGADA</b></div>
        <button id="btnC" class="btn active" onclick="setM(0)">CONTINUA</button>
        <button id="btnP" class="btn inactive" onclick="setM(1)">PULSADA</button>
        <div class="amp"><span id="at">1.65</span> A</div>
        
        <input type="range" id="slide-amp" min="0" max="4095" value="1024" oninput="upd('a',this.value)">
        
        <div id="cont-pulsada" class="hidden">
            <p>Frecuencia: <span id="fv">1</span> Hz</p>
            <input type="range" id="slide-freq" min="1" max="100" value="1" oninput="upd('f',this.value)">
            <p>Duty Cycle: <span id="dv">50</span> %</p>
            <input type="range" id="slide-duty" min="1" max="99" value="50" oninput="upd('d',this.value)">
        </div>
        
        <button class="btn btn-power" id="btn-pwr" onclick="toggleFuente()">ENCENDER FUENTE</button>
    </div>
    <script>
        let fuenteActiva = false;
        let modoPulsado = false;
        let amplitud = 1024;
        let frecuencia = 1;
        let duty = 50;

        function setM(m){ 
            modoPulsado = (m === 1);
            document.getElementById('btnC').className = (m === 0) ? 'btn active' : 'btn inactive';
            document.getElementById('btnP').className = (m === 1) ? 'btn active' : 'btn inactive';
            document.getElementById('cont-pulsada').className = (m === 1) ? '' : 'hidden';
            fetch("/modo_f?v=" + m).catch(() => {});
        }

        function upd(p, v){
            if(p === 'a') {
                amplitud = v;
                document.getElementById('at').innerText = ((v * 3.3 / 4095.0) * 2.0).toFixed(2);
            } else if(p === 'f') {
                frecuencia = v;
                document.getElementById('fv').innerText = v;
            } else if(p === 'd') {
                duty = v;
                document.getElementById('dv').innerText = v;
            }
            fetch("/set_f?p=" + p + "&v=" + v).catch(() => {});
        }

        function toggleFuente(){ 
            fuenteActiva = !fuenteActiva;
            let estEl = document.getElementById('lbl-estado');
            let pwrBtn = document.getElementById('btn-pwr');
            if (fuenteActiva) {
                estEl.innerHTML = "<b>ENCENDIDA</b>";
                estEl.style.color = "#22c55e";
                pwrBtn.innerText = "APAGAR FUENTE";
                pwrBtn.style.background = "#ef4444";
            } else {
                estEl.innerHTML = "<b>APAGADA</b>";
                estEl.style.color = "#ef4444";
                pwrBtn.innerText = "ENCENDER FUENTE";
                pwrBtn.style.background = "#3b82f6";
            }
            fetch('/act_f?run=' + (fuenteActiva ? "1" : "0")).catch(() => {});
        }
    </script>
</body>
</html>
