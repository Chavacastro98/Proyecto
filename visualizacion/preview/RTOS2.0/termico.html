<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Control T&eacute;rmico &middot; FreeRTOS 2.0 (Engineering Instrument)</title>
    <style>
        /* ==========================================================================
           VARIABLES DE TEMA: VS Dark & COMSOL Light (Instrumentación)
           ========================================================================== */
        :root, [data-theme="dark"] {
            --ui-bg: #1e1e1e;
            --ui-panel: #252526;
            --ui-subpanel: #2d2d2d;
            --ui-border: #3c3c3c;
            --ui-border-subtle: #2f2f2f;
            
            --text-primary: #f1f1f1;
            --text-secondary: #cccccc;
            --text-muted: #858585;
            --text-disabled: #555555;

            --accent-primary: #007acc;
            --accent-hover: #1f8ad2;
            --accent-active: #0e639c;

            --metro-ok: #4ec9b0;
            --metro-ok-bg: rgba(78, 201, 176, 0.12);
            --metro-ok-border: #2e8b75;
            --metro-warn: #d7ba7d;
            --metro-warn-bg: rgba(215, 186, 125, 0.12);
            --metro-warn-border: #a88a4d;
            --metro-err: #f14c4c;
            --metro-err-bg: rgba(241, 76, 76, 0.12);
            --metro-err-border: #aa3333;
            
            --disp-bg: #141414;
            --disp-border: #333333;
            --disp-val: #4ec9b0;
            --disp-panel: #1b1b1c;

            --btn-bg: #2d2d2d;
            --btn-border: #3c3c3c;
            --btn-text: #cccccc;
            --btn-hover-bg: #383838;

            --bar-track: #2a2a2a;
        }

        [data-theme="light"] {
            --ui-bg: #f3f3f3;
            --ui-panel: #ffffff;
            --ui-subpanel: #e8e8e8;
            --ui-border: #d4d4d4;
            --ui-border-subtle: #e5e5e5;

            --text-primary: #1e1e1e;
            --text-secondary: #333333;
            --text-muted: #666666;
            --text-disabled: #a0a0a0;

            --accent-primary: #005fb8;
            --accent-hover: #106ebe;
            --accent-active: #004578;

            --metro-ok: #2e7d32;
            --metro-ok-bg: #e8f5e9;
            --metro-ok-border: #81c784;
            --metro-warn: #b45309;
            --metro-warn-bg: #fffbeb;
            --metro-warn-border: #fcd34d;
            --metro-err: #c62828;
            --metro-err-bg: #ffebee;
            --metro-err-border: #ef9a9a;

            --disp-bg: #f9f9fb;
            --disp-border: #b8b8b8;
            --disp-val: #005fb8;
            --disp-panel: #f0f0f4;

            --btn-bg: #e8e8e8;
            --btn-border: #cccccc;
            --btn-text: #222222;
            --btn-hover-bg: #dedede;

            --bar-track: #e0e0e0;
        }

        /* ==========================================================================
           RESET & TIPOGRAFÍA DE INGENIERÍA
           ========================================================================== */
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
            background:var(--ui-bg);
            color:var(--text-secondary);
            min-height:100vh;
            padding:0;
            transition:background 0.2s ease, color 0.2s ease;
        }
                .container{
            width:100%;
            max-width:1100px;
            margin:0 auto;
            padding:14px 14px 40px;
            transition:max-width 0.2s ease;
        }

        /* Grid de Tinas Térmicas (Desktop 4 columnas, Tablet 2 columnas, Móvil 1 columna) */
        .grid{
            display:grid;
            grid-template-columns:repeat(4, 1fr);
            gap:12px;
        }
        @media(max-width:960px){
            .container{max-width:840px;}
            .grid{grid-template-columns:repeat(2, 1fr);gap:12px;}
        }
        @media(max-width:640px){
            .container{max-width:520px;}
            .grid{grid-template-columns:1fr;gap:12px;}
            .btn-group{flex-direction:column;}
            .btn-pwr{max-width:100%;}
        }

        /* Tarjeta de Tina Térmica */
        .card{
            background:var(--ui-panel);
            border-radius:4px;
            padding:14px 16px;
            border:1px solid var(--ui-border);
            border-left:3px solid var(--accent-primary);
            transition:border-color 0.2s;
            position:relative;
        }
        .card-head{
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin-bottom:10px;
            padding-bottom:8px;
            border-bottom:1px solid var(--ui-border-subtle);
        }
        .card-name{
            font-size:0.85em;
            color:var(--text-primary);
            font-weight:700;
            letter-spacing:0.2px;
        }

        /* Tendencia de Temperatura */
        .trend{
            display:inline-flex;
            align-items:center;
            gap:4px;
            font-size:0.7em;
            font-weight:700;
            padding:2px 6px;
            border-radius:2px;
            font-family:Consolas,monospace;
            border:1px solid transparent;
        }
        .trend-up{
            color:var(--metro-warn);
            background:var(--metro-warn-bg);
            border-color:var(--metro-warn-border);
        }
        .trend-down{
            color:var(--accent-primary);
            background:rgba(0, 122, 204, 0.12);
            border-color:var(--accent-primary);
        }
        .trend-stable{
            color:var(--metro-ok);
            background:var(--metro-ok-bg);
            border-color:var(--metro-ok-border);
        }

        /* Display de Temperatura */
        .temp-wrap{
            padding:6px 0 8px;
            text-align:center;
        }
        .temp-val{
            font-family:Consolas,"Cascadia Code","SF Mono",monospace;
            font-size:2.2em;
            font-weight:700;
            letter-spacing:-1px;
            font-variant-numeric:tabular-nums;
            line-height:1;
            margin-bottom:4px;
            color:var(--text-primary);
            transition:color 0.2s;
        }
        .temp-unit{
            font-size:0.5em;
            color:var(--text-muted);
            font-weight:600;
            margin-left:3px;
        }

        /* Barra de Progreso a Setpoint */
        .sp-prog-lbl{
            text-align:center;
            font-size:0.65em;
            font-weight:700;
            color:var(--text-muted);
            margin-bottom:4px;
            font-family:Consolas,monospace;
        }
        .sp-progress{
            margin:2px auto 8px;
            height:5px;
            border-radius:2px;
            background:var(--bar-track);
            overflow:hidden;
            max-width:180px;
            border:1px solid var(--ui-border);
        }
        .sp-prog-fill{
            height:100%;
            border-radius:1px;
            transition:width 0.3s ease-out, background 0.3s;
        }

        /* Barra de Potencia ZCS / PWM */
        .pwm-wrap{
            margin:8px 0 10px;
            background:var(--disp-panel);
            padding:8px 10px;
            border-radius:3px;
            border:1px solid var(--ui-border);
        }
        .pwm-lbl-row{
            display:flex;
            justify-content:space-between;
            font-size:0.68em;
            color:var(--text-muted);
            font-weight:700;
            margin-bottom:4px;
            font-family:Consolas,monospace;
        }
        .pwm-bar-bg{
            height:5px;
            background:var(--bar-track);
            border-radius:1px;
            overflow:hidden;
            border:1px solid var(--ui-border);
        }
        .pwm-bar-fill{
            height:100%;
            background:var(--accent-primary);
            width:0%;
            transition:width 0.3s ease-out;
        }

        /* Caja de Ajuste de Setpoint */
        .sp-box{
            background:var(--disp-panel);
            padding:8px 10px;
            border-radius:3px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            border:1px solid var(--ui-border);
        }
        .sp-lbl-wrap{display:flex;flex-direction:column;}
        .sp-lbl{
            font-size:0.62em;
            color:var(--text-muted);
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:0.5px;
            font-family:Consolas,monospace;
        }
        .sp-val{
            font-size:1.05em;
            font-weight:700;
            color:var(--text-primary);
            font-family:Consolas,monospace;
            font-variant-numeric:tabular-nums;
        }
        .btn-step{
            background:var(--ui-panel);
            color:var(--text-primary);
            border:1px solid var(--ui-border);
            width:28px;
            height:28px;
            border-radius:2px;
            font-weight:700;
            cursor:pointer;
            font-size:1.1em;
            display:flex;
            align-items:center;
            justify-content:center;
            transition:all 0.15s;
        }
        .btn-step:hover:not(:disabled){
            background:var(--btn-hover-bg);
            border-color:var(--accent-primary);
            color:var(--accent-primary);
        }
        .btn-step:active{transform:scale(0.96);}
        .btn-step:disabled{opacity:0.35;cursor:not-allowed;}

        /* Fila de Estado */
        .status-row{
            margin-top:10px;
            font-size:0.72em;
            font-weight:700;
            display:flex;
            align-items:center;
            justify-content:space-between;
            font-family:Consolas,monospace;
            color:var(--text-muted);
        }
        .st-pill{
            display:inline-flex;
            align-items:center;
            gap:5px;
            padding:2px 6px;
            border-radius:2px;
            font-size:0.9em;
            border:1px solid transparent;
        }
        .st-active{
            background:var(--metro-ok-bg);
            color:var(--metro-ok);
            border-color:var(--metro-ok-border);
        }
        .st-standby{
            background:var(--ui-subpanel);
            color:var(--text-muted);
            border-color:var(--ui-border);
        }
        .badge-error{
            background:var(--metro-err-bg);
            color:var(--metro-err);
            border:1px solid var(--metro-err-border);
            padding:2px 6px;
            border-radius:2px;
            font-size:0.9em;
            font-weight:700;
            display:inline-flex;
            align-items:center;
            gap:4px;
        }

        /* Toast Notifications */
        .toast-container{
            position:fixed;
            bottom:16px;
            right:16px;
            display:flex;
            flex-direction:column;
            gap:6px;
            z-index:9999;
            pointer-events:none;
        }
        .toast{
            padding:8px 12px;
            border-radius:3px;
            font-size:0.75em;
            font-weight:700;
            color:var(--text-primary);
            background:var(--ui-panel);
            border:1px solid var(--ui-border);
            pointer-events:auto;
            max-width:320px;
            display:flex;
            align-items:center;
            gap:6px;
            box-shadow:0 2px 8px rgba(0,0,0,0.25);
            font-family:Consolas,monospace;
        }
        .toast.out{opacity:0;transition:opacity 0.2s;}
        .toast-ok{border-left:3px solid var(--metro-ok);}
        .toast-err{border-left:3px solid var(--metro-err);}
        .toast-warn{border-left:3px solid var(--metro-warn);}
        .toast-info{border-left:3px solid var(--accent-primary);}
    </style>
</head>
<body>
    <div class='container'>
        <div class='hub-bar'>
            <a href='../index.html' class='hub-link'>&larr; Hub de Versiones (Tesis)</a>
            <button class='theme-btn' onclick='toggleTheme()' title='Alternar Modo Día / Noche'>
                <span id='theme-btn-lbl'>Modo D&iacute;a</span>
            </button>
        </div>

        <div class='hdr'>
            <a href='index.html' class='nav-back'>&larr; Men&uacute;</a>
            <div>
                <div class='hdr-title'>Control T&eacute;rmico</div>
                <span class='hdr-sub'>REGULACIÓN TÉRMICA EN 4 TINAS</span>
            </div>
            <div class='hdr-hb'>
                <span class='hb-dot' id='hb-dot'></span>
                <span style='font-family:Consolas,monospace;font-size:0.85em;'>En l&iacute;nea</span>
            </div>
        </div>

        <div class='sum-bar'>
            <span>ESTADO GENERAL DEL SISTEMA:</span>
            <span class='sum-pill active' id='sum-pill'>&#9679; 2/4 tinas activas</span>
        </div>

        <div class='btn-group'>
            <button class='btn-pwr btn-act' onclick='toggleT(1)'>ACTIVAR CALENTAMIENTO</button>
            <button class='btn-pwr btn-stop' onclick='toggleT(0)'>PARAR SISTEMA</button>
        </div>

        <div class='grid' id='t-cards'></div>
    </div>

    <div class='toast-container' id='toast-box'></div>

    <script>
        var nombres = ["Tina 1: Limpieza (450W)", "Tina 2: Decapado (450W)", "Tina 3: Zincado (18W)", "Tina 4: Niquelado (450W)"];
        var mockThermal = [
            { t: 64.8, sp: 65.0, p: 28, run: 1 },
            { t: 25.1, sp: 30.0, p: 0, run: 0 },
            { t: 44.9, sp: 45.0, p: 35, run: 1 },
            { t: 24.3, sp: 25.0, p: 0, run: 0 }
        ];
        var prevTemps = [64.5, 25.1, 45.2, 24.3];

        /* ==========================================================================
           GESTIÓN DE TEMA DUAL
           ========================================================================== */
        function initTheme() {
            var saved = localStorage.getItem('electrodo32_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            updateThemeBtn(saved);
        }

        function toggleTheme() {
            var cur = document.documentElement.getAttribute('data-theme') || 'dark';
            var next = (cur === 'dark') ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('electrodo32_theme', next);
            updateThemeBtn(next);
            renderThermal(mockThermal);
        }

        function updateThemeBtn(th) {
            var btn = document.getElementById('theme-btn-lbl');
            if (!btn) return;
            btn.innerHTML = (th === 'dark') ? 'Modo D&iacute;a' : 'Modo Noche';
        }

        initTheme();

        /* ==========================================================================
           LÓGICA DEL SISTEMA TÉRMICO
           ========================================================================== */
        function showToast(msg, type){
            var box = document.getElementById('toast-box');
            var t = document.createElement('div');
            t.className = 'toast toast-' + (type || 'info');
            t.innerHTML = msg;
            box.appendChild(t);
            setTimeout(function(){
                t.classList.add('out');
                setTimeout(function(){ t.remove(); }, 300);
            }, 3500);
        }

        function spProgressColor(t, sp){
            var isDark = (document.documentElement.getAttribute('data-theme') !== 'light');
            var ratio = t / sp;
            if(ratio < 0.7) return isDark ? '#007acc' : '#005fb8';
            if(ratio < 0.95) return isDark ? '#d7ba7d' : '#b45309';
            if(ratio <= 1.05) return isDark ? '#4ec9b0' : '#2e7d32';
            return isDark ? '#f14c4c' : '#c62828';
        }

        function renderThermal(data){
            var h = '';
            var running = 0;
            var isDark = (document.documentElement.getAttribute('data-theme') !== 'light');

            data.forEach(function(c, i){
                if(c.run == 1) running++;
                var esError = (c.t < -90.0);
                var tempDisplay = esError ? "DESC" : (c.t.toFixed(1) + '<span class="temp-unit">&deg;C</span>');
                var colorTemp = esError ? (isDark ? "#f14c4c" : "#c62828") : 
                                (c.run == 1 ? (Math.abs(c.t - c.sp) < 1.5 ? (isDark ? "#4ec9b0" : "#2e7d32") : (isDark ? "#d7ba7d" : "#b45309")) : (isDark ? "#858585" : "#666666"));
                var colorBorde = esError ? (isDark ? "#f14c4c" : "#c62828") : (c.run == 1 ? (isDark ? "#4ec9b0" : "#2e7d32") : (isDark ? "#007acc" : "#005fb8"));

                var diff = esError ? 0 : (c.t - prevTemps[i]);
                var tArrow = '';
                if(c.run == 1 && !esError){
                    if(diff > 0.08) tArrow = '<span class="trend trend-up">&uarr; +' + diff.toFixed(1) + '&deg;C</span>';
                    else if(diff < -0.08) tArrow = '<span class="trend trend-down">&darr; ' + diff.toFixed(1) + '&deg;C</span>';
                    else tArrow = '<span class="trend trend-stable">&rarr; Estable</span>';
                }

                var estadoHtml = esError ? '<span class="badge-error">&#9888; SENSOR ABIERTO</span>' :
                                 (c.run == 1 ? '<span class="st-pill st-active">&#9679; REGULANDO</span>' :
                                 '<span class="st-pill st-standby">&#9675; STANDBY</span>');

                var spPct = esError ? 0 : Math.min(Math.max((c.t / c.sp) * 100, 0), 100);
                var spCol = esError ? (isDark ? '#f14c4c' : '#c62828') : spProgressColor(c.t, c.sp);
                var spDist = esError ? '---' : (Math.abs(c.t - c.sp).toFixed(1) + '\u00b0C ' + (c.t < c.sp ? 'por debajo' : (c.t > c.sp + 1 ? 'por encima' : 'en objetivo')));

                h += '<div class="card" style="border-left-color:' + colorBorde + '">' +
                    '<div class="card-head">' +
                        '<span class="card-name">' + nombres[i] + '</span>' +
                        tArrow +
                    '</div>' +
                    '<div class="temp-wrap">' +
                        '<div class="temp-val" style="color:' + colorTemp + '">' + tempDisplay + '</div>' +
                    '</div>' +
                    '<div class="sp-prog-lbl">' + spDist + '</div>' +
                    '<div class="sp-progress"><div class="sp-prog-fill" style="width:' + spPct + '%;background:' + spCol + '"></div></div>' +
                    '<div class="pwm-wrap">' +
                        '<div class="pwm-lbl-row">' +
                            '<span>Potencia Aplicada</span>' +
                            '<span>' + c.p + '%</span>' +
                        '</div>' +
                        '<div class="pwm-bar-bg">' +
                            '<div class="pwm-bar-fill" style="width:' + c.p + '%;"></div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="sp-box">' +
                        '<div class="sp-lbl-wrap">' +
                            '<span class="sp-lbl">Setpoint</span>' +
                            '<span class="sp-val">' + c.sp.toFixed(1) + ' &deg;C</span>' +
                        '</div>' +
                        '<div style="display:flex;gap:6px;">' +
                            '<button class="btn-step" ' + (c.run == 1 || esError ? 'disabled' : '') + ' onclick="setSP(' + i + ',' + (c.sp - 1) + ')">&minus;</button>' +
                            '<button class="btn-step" ' + (c.run == 1 || esError ? 'disabled' : '') + ' onclick="setSP(' + i + ',' + (c.sp + 1) + ')">&plus;</button>' +
                        '</div>' +
                    '</div>' +
                    '<div class="status-row"><span>Estado:</span>' + estadoHtml + '</div>' +
                '</div>';

                if(!esError) prevTemps[i] = c.t;
            });
            document.getElementById('t-cards').innerHTML = h;

            var sumPill = document.getElementById('sum-pill');
            if(running > 0){
                sumPill.className = 'sum-pill active';
                sumPill.innerHTML = '&#9679; ' + running + '/4 tinas activas';
            } else {
                sumPill.className = 'sum-pill idle';
                sumPill.innerHTML = '&#9675; En Reposo (0/4)';
            }
        }

        function setSP(id, val){
            if(val < 0) val = 0; if(val > 150) val = 150;
            if(mockThermal[id].run === 1){
                showToast('Detenga el sistema térmico primero para cambiar el setpoint.', 'warn');
                return;
            }
            mockThermal[id].sp = val;
            showToast('SP ' + nombres[id] + ' = ' + val + '°C', 'info');
            renderThermal(mockThermal);
            fetch('/set_t?id=' + id + '&v=' + val).catch(function(){});
        }

        function toggleT(run){
            mockThermal.forEach(function(d){
                d.run = run;
                d.p = (run === 1 ? Math.round(20 + Math.random() * 30) : 0);
            });
            showToast(run == 1 ? 'Sistema térmico ENCENDIDO' : 'Sistema térmico APAGADO', run == 1 ? 'ok' : 'info');
            renderThermal(mockThermal);
            fetch('/act_t?run=' + run).catch(function(){});
        }

        function simLoop(){
            mockThermal.forEach(function(d){
                if(d.run === 1){
                    var diff = d.sp - d.t;
                    d.t += (diff * 0.05) + (Math.random() - 0.48) * 0.15;
                    d.p = Math.min(Math.max(Math.round(diff * 15), 0), 100);
                } else {
                    if(d.t > 24.5) d.t -= 0.1;
                }
            });
            renderThermal(mockThermal);
        }

        renderThermal(mockThermal);
        setInterval(simLoop, 2500);
    </script>
</body>
</html>
