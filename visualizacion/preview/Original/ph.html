<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo pH Dual - Original</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #1e293b;
            border-radius: 15px;
            padding: 20px;
            width: 280px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .ph-val {
            font-size: 56px;
            color: #2ecc71;
            font-weight: bold;
            margin: 10px 0;
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
            font-size: 0.95em;
            transition: 0.2s;
        }
        .btn:hover {
            background: #2563eb;
        }
        .nav-back {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05em;
        }
        .nav-back:hover {
            color: #7dd3fc;
        }
        .cal-menu {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .ph-error {
            color: #ef4444 !important;
            font-size: 36px !important;
        }
    </style>
</head>
<body>
    <a href="index.html" class="nav-back">⬅ Volver al Menú</a>
    <h2>Monitoreo y Calibración ADS1115 (16-Bits)</h2>
    
    <div class="grid">
        <div class="card">
            <h3>Electrodo pH 1 (Zincado)</h3>
            <div class="ph-val" id="ph1">7.00</div>
            <div class="cal-menu">
                <small>Menú de Calibración</small>
                <button class="btn" onclick="calibrar(1,7)">Calibrar punto pH 7.0</button>
                <button class="btn" onclick="calibrar(1,4)">Calibrar punto pH 4.0</button>
            </div>
        </div>
        <div class="card">
            <h3>Electrodo pH 2 (Niquelado)</h3>
            <div class="ph-val" id="ph2">7.00</div>
            <div class="cal-menu">
                <small>Menú de Calibración</small>
                <button class="btn" onclick="calibrar(2,7)">Calibrar punto pH 7.0</button>
                <button class="btn" onclick="calibrar(2,4)">Calibrar punto pH 4.0</button>
            </div>
        </div>
    </div>

    <script>
        function readPH(){
            fetch('/get_ph_dual')
                .then(r => r.json())
                .then(d => {
                    let p1Val = parseFloat(d.p1);
                    let p2Val = parseFloat(d.p2);
                    
                    let el1 = document.getElementById('ph1');
                    let el2 = document.getElementById('ph2');

                    // Mostrar error si la lectura está fuera del rango físico (0 a 14)
                    if(p1Val < 0 || p1Val > 14 || isNaN(p1Val)){
                        el1.innerText = "⚠️ ERROR";
                        el1.className = "ph-val ph-error";
                    } else {
                        el1.innerText = d.p1;
                        el1.className = "ph-val";
                    }

                    if(p2Val < 0 || p2Val > 14 || isNaN(p2Val)){
                        el2.innerText = "⚠️ ERROR";
                        el2.className = "ph-val ph-error";
                    } else {
                        el2.innerText = d.p2;
                        el2.className = "ph-val";
                    }
                })
                .catch(() => {
                    // Datos simulados para vista previa local
                    const p1 = (7.00 + (Math.random() * 0.06 - 0.03)).toFixed(2);
                    const p2 = (4.15 + (Math.random() * 0.04 - 0.02)).toFixed(2);
                    document.getElementById('ph1').innerText = p1;
                    document.getElementById('ph2').innerText = p2;
                });
        }

        function calibrar(id, punto){
            if(confirm(`¿Confirmas sumergir el electrodo ${id} en buffer pH ${punto} y calibrar?`)){
                fetch(`/do_cal_ph?id=${id}&p=${punto}`)
                    .then(() => alert('Punto guardado en NVS Preferences.'))
                    .catch(() => alert(`[Vista Previa] Punto pH ${punto} guardado en memoria para Electrodo ${id}.`));
            }
        }

        setInterval(readPH, 2500); 
        readPH();
    </script>
</body>
</html>
